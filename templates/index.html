<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VICOBA — Mhazinaji Mtandao</title>
<meta name="description" content="Mfumo wa Kisasa wa Usimamizi wa Fedha za VICOBA (Digital Treasurer).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-icon">💰</div>
      <div>
        <h1>VICOBA</h1>
      </div>
      <div class="pills-group">
        <span class="health-pill" id="healthPill">Mingatio: ...</span>
        <span class="health-pill" id="userChip" style="display:none"></span>
      </div>
    </div>
    <div class="actions">
      <button id="adminUsersBtn" onclick="openUsersModal()" style="display:none">👥 Watumiaji</button>
      <button id="settingsBtn" onclick="openSettingsModal()">⚙️ Mipangilio</button>
      <button onclick="exportCSV()">📄 CSV</button>
      <button onclick="location='/logout'">Kutoka</button>
    </div>
  </div>
</div>

<div class="app-container">
  <!-- Navigation Tabs -->
  <div class="tabs-wrapper">
    <button id="tabBtn-input" class="active" onclick="showTab('input')">⚡ Ingiza Maagizo</button>
    <button id="tabBtn-dash" onclick="showTab('dash')">📊 Dashboard</button>
    <button id="tabBtn-members" onclick="showTab('members')">👥 Wanachama</button>
    <button id="tabBtn-meeting" onclick="showTab('meeting')">📑 Kutaniko</button>
  </div>

  <!-- Tab 1: Input Command Terminal -->
  <div id="tab-input" class="section active">
    <div class="input-card">
      <div class="input-card-title">✨ Injini ya Swahili Commands & AI</div>
      <form id="inputForm" onsubmit="handleParse(event)">
        <div class="input-row">
          <textarea id="cmdInput" placeholder="Andika maagizo hapa... mfano: Amina amelipa hisa 5000 QX84920193" autofocus></textarea>
          <button type="submit" id="parseBtn" class="btn-submit">→</button>
        </div>
      </form>
      <div class="quick-triggers">
        <span class="chip" onclick="fillTrigger('Amina amelipa hisa 5000, jamii 1000 ref QX84920193')">+ Mchango (M-Pesa)</span>
        <span class="chip" onclick="fillTrigger('Juma kopa 50000 wadhamini ni Fatuma')">+ Mkopo</span>
        <span class="chip" onclick="fillTrigger('Juma amelipa mkopo 10000 ref QX9920112')">+ Rejesho</span>
        <span class="chip" onclick="fillTrigger('ada ya kikundi 2000')">+ Ada</span>
        <span class="chip" onclick="fillTrigger('faini ya Juma 1000')">+ Faini</span>
        <span class="chip" onclick="fillTrigger('taarifa ya Amina')">🔍 Taarifa</span>
        <span class="chip" onclick="fillTrigger('ondoa mwanachama Juma')">🚪 Kutoka</span>
      </div>
    </div>

    <div id="previewArea"></div>
    <div id="messageArea"></div>
  </div>

  <!-- Tab 2: Dashboard Grid -->
  <div id="tab-dash" class="section">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="table-wrap">
      <div class="table-header">
        <span>Wanachama — Muhtasari wa Akiba & Hisa</span>
        <button class="btn-sm" onclick="loadDashboard()">🔄 Subiri</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Jina la Mwanachama</th>
              <th class="right">Hisa (TSH)</th>
              <th class="right">Akiba (TSH)</th>
              <th class="right">Deni Mkopo (TSH)</th>
            </tr>
          </thead>
          <tbody id="memberTable"></tbody>
        </table>
      </div>
    </div>

    <button onclick="showGawio()" style="width:100%;padding:14px;background:rgba(245, 158, 11, 0.15);border:1.5px solid var(--accent-amber);color:#fcd34d;border-radius:var(--radius-lg);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:24px;transition:all 0.2s">📊 Makadirio ya Gawio (Profit Distribution Preview)</button>
    <div id="gawioArea"></div>
  </div>

  <!-- Tab 3: Members Registry -->
  <div id="tab-members" class="section">
    <button id="registerMemberBtn" onclick="openRegisterModal()" style="width:100%;padding:14px;background:linear-gradient(135deg, #10b981, #059669);color:#fff;border:none;border-radius:var(--radius-lg);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px;box-shadow:0 4px 16px rgba(16,185,129,0.3)">➕ Sajili Mwanachama Mpya</button>
    <input type="text" class="search-box" id="memberSearchInput" placeholder="Tafuta kwa jina au namba (mfano: BSDA-001)..." oninput="filterMembersTable()">

    <div class="table-wrap">
      <div class="table-header">
        <span>Orodha Kamili ya Wanachama</span>
        <button class="btn-sm" onclick="loadMembers()">🔄 Anza Upya</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Namba</th>
              <th>Jina</th>
              <th>Hali</th>
              <th class="right">Kitendo</th>
            </tr>
          </thead>
          <tbody id="fullMemberTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tab 4: Meeting Report -->
  <div id="tab-meeting" class="section">
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <button onclick="loadMeeting()" style="flex:1;padding:13px;background:linear-gradient(135deg, #10b981, #059669);color:#fff;border:none;border-radius:var(--radius-md);font-size:13.5px;font-weight:700;cursor:pointer">Ripoti ya Kutaniko Leo</button>
      <button onclick="loadUnpaid()" style="flex:1;padding:13px;background:rgba(245,158,11,0.15);color:#fcd34d;border:1.5px solid var(--accent-amber);border-radius:var(--radius-md);font-size:13.5px;font-weight:700;cursor:pointer">Hawajalipa Leo?</button>
    </div>
    <div id="meetingArea"></div>
  </div>
</div>

<!-- Main App Modal Overlay -->
<div class="modal-overlay" id="appModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Taarifa</div>
      <button class="btn-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
