<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VICOBA — Ingia Mfumoni</title>
<meta name="description" content="Mhazinaji Mtandao wa VICOBA — Ingia kwenye mfumo wa usimamizi wa fedha za kikundi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #06120e;
    --card-bg: rgba(15, 34, 26, 0.75);
    --card-border: rgba(45, 212, 191, 0.22);
    --card-border-glow: rgba(16, 185, 129, 0.35);
    --text-main: #f0fdf4;
    --text-muted: #86efac;
    --text-dim: #5eead4;
    --accent-emerald: #10b981;
    --accent-teal: #14b8a6;
    --accent-cyan: #06b6d4;
    --input-bg: rgba(6, 26, 19, 0.6);
    --input-border: rgba(45, 212, 191, 0.25);
    --input-focus: #10b981;
    --shadow-main: 0 25px 60px rgba(0, 0, 0, 0.6);
    --radius-lg: 24px;
    --radius-md: 14px;
  }

  html, body {
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Animated Ambient Glowing Orbs */
  .bg-orbs {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    animation: floatOrb 12s ease-in-out infinite alternate;
  }
  .orb-1 {
    width: 450px; height: 450px;
    background: radial-gradient(circle, #10b981, #047857);
    top: -120px; left: -100px;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #06b6d4, #0f766e);
    bottom: -100px; right: -80px;
    animation-delay: -4s;
  }
  .orb-3 {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #34d399, #059669);
    top: 45%; left: 55%;
    opacity: 0.25;
    animation-delay: -7s;
  }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(25px, -30px) scale(1.08); }
    100% { transform: translate(-20px, 20px) scale(0.95); }
  }

  /* Grid overlay pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(45, 212, 191, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45, 212, 191, 0.03) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
    z-index: 1;
  }

  /* Main Card */
  .card {
    position: relative;
    z-index: 10;
    background: var(--card-bg);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 44px 38px;
    width: 100%;
    max-width: 410px;
    box-shadow: var(--shadow-main), 0 0 40px rgba(16, 185, 129, 0.1) inset;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }

  /* Brand Header */
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
    border-radius: 20px;
    font-size: 34px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4); }
    50% { box-shadow: 0 12px 40px rgba(6, 182, 212, 0.6); }
  }
  .logo h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .logo p {
    color: rgba(255, 255, 255, 0.65);
    font-size: 13.5px;
    font-weight: 500;
  }

  /* Error Banner */
  .alert-error {
    background: rgba(239, 68, 68, 0.16);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .input-wrap {
    position: relative;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    pointer-events: none;
    opacity: 0.7;
  }
  .form-group input {
    width: 100%;
    padding: 14px 14px 14px 44px;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: inherit;
    color: var(--text-main);
    outline: none;
    transition: all 0.25s ease;
  }
  .form-group input::placeholder { color: rgba(255, 255, 255, 0.35); }
  .form-group input:focus {
    border-color: var(--input-focus);
    background: rgba(15, 45, 34, 0.85);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
  }

  /* Password / PIN Input */
  input[type="password"] {
    font-size: 22px !important;
    letter-spacing: 7px;
    font-family: 'JetBrains Mono', monospace !important;
    padding-top: 10px !important;
    padding-bottom: 10px !important;
  }
  input[type="password"]::placeholder {
    font-size: 14px !important;
    letter-spacing: normal !important;
    font-family: 'Plus Jakarta Sans', sans-serif !important;
  }

  /* Login Button */
  .btn-login {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #ffffff;
    border: none;
    border-radius: var(--radius-md);
    font-size: 15.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.3px;
    margin-top: 10px;
    transition: all 0.25s ease;
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(16, 185, 129, 0.5);
    background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
  }
  .btn-login:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }
  .divider span {
    color: rgba(255, 255, 255, 0.45);
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Security note */
  .note {
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    margin-top: 24px;
    line-height: 1.6;
    padding: 0 6px;
  }
  .note strong { color: #a7f3d0; font-weight: 600; }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">💰</div>
    <h1>VICOBA</h1>
    <p>Mhazinaji Mtandao · Digital Treasurer</p>
  </div>

  {% if error %}
  <div class="alert-error">
    <span>⚠️</span>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" action="/login" autocomplete="off">
    <div class="form-group">
      <label>Jina lako</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input
          type="text"
          name="name"
          id="name-input"
          value="Mwenyekiti"
          placeholder="Mwenyekiti"
          autocomplete="username"
        >
      </div>
    </div>

    <div class="divider"><span>na</span></div>

    <div class="form-group">
      <label>PIN ya Siri</label>
      <div class="input-wrap">
        <span class="input-icon">🔑</span>
        <input
          type="password"
          name="pin"
          id="pin-input"
          placeholder="Weka PIN"
          minlength="4"
          maxlength="8"
          required
          autofocus
          autocomplete="current-password"
          inputmode="numeric"
        >
      </div>
    </div>

    <button type="submit" class="btn-login" id="login-btn">
      <span>Ingia Mfumoni</span>
      <span>→</span>
    </button>
  </form>

  <p class="note">
    Akaunti ya kwanza inakuwa <strong>Mwenyekiti</strong>.<br>
    PIN inahifadhiwa kwa usalama kamili wa mfumo.
  </p>
</div>

<script>
  document.querySelector('form').addEventListener('submit', function() {
    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<span class="spin" style="width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block"></span>';
    btn.disabled = true;
  });
</script>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
