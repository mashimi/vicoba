<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VICOBA — Ingia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px 24px;max-width:360px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:28px;color:#1a7a4c}
.logo p{color:#666;font-size:14px;margin-top:4px}
label{display:block;font-size:14px;color:#333;margin-bottom:6px;font-weight:500}
input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;margin-bottom:16px;outline:none;transition:border .2s}
input:focus{border-color:#1a7a4c}
button{width:100%;padding:14px;background:#1a7a4c;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#156a40}
.error{color:#d32f2f;font-size:13px;text-align:center;margin-top:8px}
.setup{font-size:12px;color:#888;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>💰 VICOBA</h1>
    <p>Mhazinaji Mtandao</p>
  </div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Jina lako</label>
    <input type="text" name="name" value="Mhazinaji" placeholder="Mhazinaji">
    <label>PIN ya siri (nambari 4-8)</label>
    <input type="password" name="pin" placeholder="••••" minlength="4" maxlength="8" required autofocus>
    <button type="submit">Ingia</button>
  </form>
  <p class="setup">PIN yako inahifadhiwa kama hash — haiwezi kusomwa.</p>
</div>
</body>
</html>
